<!DOCTYPE html>
<html lang="en">
<head>
    <title>Viewshed analysis on terrain</title>
    <meta property="og:description" content="Baseline: a minimal custom layer that renders MapLibre's terrain mesh using the official projection prelude. This is the starting point for the viewshed analysis feature; it verifies that the terrain mesh renders correctly before any analysis logic is layered on top." />
    <meta property="og:created" content="2026-04-23" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css" />
    <script src="../../dist/maplibre-gl-dev.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
// =============================================================================
// Minimal terrain custom layer
//
// Reuses MapLibre's terrain mesh (one mesh per renderable tile) and projects
// each vertex with the official prelude's projectTileFor3D, producing a
// semi-transparent overlay used to verify that terrain rendering is correct.
//
// Public APIs used:
//   - map.terrain.tileManager.getRenderableTiles()
//   - map.terrain.getTerrainMesh(tileID)
//   - map.terrain.getTerrainData(tileID)
//   - map.terrain.getMeshFrameDelta(zoom)
//   - map.transform.getProjectionData(...)
//   - args.shaderData.{variantName, vertexShaderPrelude, define}
// =============================================================================

const map = new maplibregl.Map({
    container: 'map',
    zoom: 12.5,
    center: [11.39085, 47.27574],
    pitch: 70,
    bearing: -20,
    maxPitch: 85,
    style: {
        version: 8,
        sources: {
            osm: {
                type: 'raster',
                tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                tileSize: 256,
                attribution: '&copy; OpenStreetMap Contributors',
                maxzoom: 19
            },
            terrainSource: {
                type: 'raster-dem',
                url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
                tileSize: 256
            }
        },
        layers: [{id: 'osm', type: 'raster', source: 'osm'}],
        terrain: {source: 'terrainSource', exaggeration: 1.0}
    }
});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));

const terrainOverlayLayer = {
    id: 'terrain-overlay',
    type: 'custom',
    renderingMode: '3d',

    onAdd() {
        this.programCache = new Map();
    },

    onRemove(_, gl) {
        for (const v of this.programCache.values()) gl.deleteProgram(v.program);
        this.programCache.clear();
    },

    _getProgram(gl, shaderData) {
        const key = shaderData.variantName;
        if (this.programCache.has(key)) return this.programCache.get(key);

        const vs = `#version 300 es
            precision highp float;
            ${shaderData.vertexShaderPrelude}
            ${shaderData.define}

            in vec3 a_pos3d;

            uniform sampler2D u_terrain;
            uniform mat4 u_terrain_matrix;
            uniform float u_terrain_dim;
            uniform vec4 u_terrain_unpack;
            uniform float u_terrain_exaggeration;
            uniform float u_ele_delta;

            float ele(vec2 pos) {
                vec4 rgb = (texture(u_terrain, pos) * 255.0) * u_terrain_unpack;
                return rgb.r + rgb.g + rgb.b - u_terrain_unpack.a;
            }
            float get_elevation(vec2 pos) {
                vec2 coord = (u_terrain_matrix * vec4(pos, 0.0, 1.0)).xy * u_terrain_dim + 1.0;
                vec2 f = fract(coord);
                vec2 c = (floor(coord) + 0.5) / (u_terrain_dim + 2.0);
                float d = 1.0 / (u_terrain_dim + 2.0);
                float tl = ele(c);
                float tr = ele(c + vec2(d, 0.0));
                float bl = ele(c + vec2(0.0, d));
                float br = ele(c + vec2(d, d));
                return mix(mix(tl, tr, f.x), mix(bl, br, f.x), f.y) * u_terrain_exaggeration;
            }

            void main() {
                float e = get_elevation(a_pos3d.xy);
                float ele_delta = a_pos3d.z == 1.0 ? u_ele_delta : 0.0;
                gl_Position = projectTileFor3D(a_pos3d.xy, e - ele_delta);
            }`;

        const fs = `#version 300 es
            precision highp float;

            out vec4 fragColor;

            void main() {
                fragColor = vec4(0.20, 0.55, 0.95, 0.35);
            }`;

        const compile = (type, src, label) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error(`[${key}] ${label}:\n` + gl.getShaderInfoLog(s));
            }
            return s;
        };
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vs, 'vertex'));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs, 'fragment'));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(`[${key}] link: ` + gl.getProgramInfoLog(program));
        }

        const aPos3d = gl.getAttribLocation(program, 'a_pos3d');
        const u = {};
        for (const n of [
            'u_projection_matrix', 'u_projection_fallback_matrix',
            'u_projection_clipping_plane', 'u_projection_transition',
            'u_projection_tile_mercator_coords',
            'u_terrain', 'u_terrain_matrix', 'u_terrain_dim',
            'u_terrain_unpack', 'u_terrain_exaggeration', 'u_ele_delta'
        ]) u[n] = gl.getUniformLocation(program, n);

        const entry = {program, aPos3d, u};
        this.programCache.set(key, entry);
        return entry;
    },

    render(gl, args) {
        const terrain = map.terrain;
        if (!terrain) return;

        const {program, aPos3d, u} = this._getProgram(gl, args.shaderData);
        gl.useProgram(program);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        const eleDelta = terrain.getMeshFrameDelta(map.transform.zoom);
        gl.uniform1f(u.u_ele_delta, eleDelta);

        for (const tile of terrain.tileManager.getRenderableTiles()) {
            const tileID = tile.tileID;
            const td = terrain.getTerrainData(tileID);

            const proj = map.transform.getProjectionData({
                overscaledTileID: tileID,
                applyTerrainMatrix: false,
                applyGlobeMatrix: true
            });
            gl.uniformMatrix4fv(u.u_projection_matrix, false, proj.mainMatrix);
            gl.uniformMatrix4fv(u.u_projection_fallback_matrix, false, proj.fallbackMatrix);
            gl.uniform4f(u.u_projection_clipping_plane, ...proj.clippingPlane);
            gl.uniform1f(u.u_projection_transition, proj.projectionTransition);
            gl.uniform4f(u.u_projection_tile_mercator_coords, ...proj.tileMercatorCoords);

            gl.activeTexture(gl.TEXTURE2);
            gl.bindTexture(gl.TEXTURE_2D, td.texture);
            gl.uniform1i(u.u_terrain, 2);
            gl.uniformMatrix4fv(u.u_terrain_matrix, false, td.u_terrain_matrix);
            gl.uniform1f(u.u_terrain_dim, td.u_terrain_dim);
            gl.uniform4fv(u.u_terrain_unpack, td.u_terrain_unpack);
            gl.uniform1f(u.u_terrain_exaggeration, td.u_terrain_exaggeration);

            const mesh = terrain.getTerrainMesh(tileID);
            gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vertexBuffer.buffer);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer.buffer);
            gl.enableVertexAttribArray(aPos3d);
            gl.vertexAttribPointer(aPos3d, 3, gl.SHORT, false, 0, 0);
            gl.drawElements(
                gl.TRIANGLES,
                mesh.segments.get()[0].primitiveLength * 3,
                gl.UNSIGNED_SHORT, 0
            );
        }
    }
};

map.on('style.load', () => {
    map.addLayer(terrainOverlayLayer);
});
</script>
</body>
</html>
