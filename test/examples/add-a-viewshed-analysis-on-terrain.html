<!DOCTYPE html>
<html lang="en">
<head>
    <title>Viewshed analysis on terrain</title>
    <meta property="og:description" content="Two-pass G-buffer viewshed analysis: top-down orthographic elevation render around the observer (Pass 1), then main terrain render that ray-marches the G-buffer in mercator space using projectTileFor3D (Pass 2)." />
    <meta property="og:created" content="2026-04-23" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css" />
    <script src="../../dist/maplibre-gl-dev.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
        #panel {
            position: absolute; top: 12px; left: 12px;
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 14px; border-radius: 6px;
            font: 12px/1.4 sans-serif; color: #222;
            min-width: 240px; box-shadow: 0 1px 4px rgba(0,0,0,.2);
        }
        #panel h4 { margin: 0 0 8px 0; font-size: 13px; }
        #panel label { display: block; margin: 6px 0 2px; }
        #panel input[type=range] { width: 100%; }
        #panel button { margin-top: 8px; }
        #panel .hint { color: #555; margin-top: 8px; font-size: 11px; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <h4>Viewshed Analysis (G-buffer + Ray-March)</h4>
    <label>Observer height: <span id="heightLabel">2</span> m</label>
    <input type="range" id="height" min="0" max="500" value="2" step="1">
    <label>AOI radius: <span id="aoiLabel">5</span> km</label>
    <input type="range" id="aoi" min="1" max="30" value="5" step="1">
    <label>Ray-march steps: <span id="stepsLabel">96</span></label>
    <input type="range" id="steps" min="16" max="256" value="96" step="8">
    <label>Bias (m): <span id="biasLabel">2.0</span></label>
    <input type="range" id="bias" min="0" max="100" value="20" step="1">
    <button id="reset">Reset observer</button>
    <div class="hint">Click on the map to set observer.<br>
        Green = visible, Red = blocked.<br>
        AOI = analysis area (mercator square around observer).</div>
</div>
<script>
// =============================================================================
// Two-Pass G-Buffer Viewshed
//
// Pass 1 (prerender, offscreen):
//   Render terrain mesh into a square top-down orthographic FBO centered on
//   the observer in mercator space. Fragment writes packed elevation as RGBA.
//   Vertex math: gl_Position = u_ortho_merc * vec4(merc.xy, ele - eleDelta, 1)
//   This is the "G-buffer": per-mercator-coordinate elevation, independent of
//   the camera view.
//
// Pass 2 (render, translucent):
//   Render terrain mesh on screen using MapLibre's official prelude
//   (args.shaderData.vertexShaderPrelude → projectTileFor3D). For each
//   fragment, ray-march in mercator XY from observer to fragment, sampling
//   the G-buffer to compare terrain elevation vs interpolated ray elevation.
//   gl_FragDepth ← MapLibre's terrain depth FBO (Depth Replacement) to
//   eliminate skirt z-fighting.
//
// Public APIs only (per arch-4 docs):
//   - map.queryTerrainElevation(lngLat)
//   - map.terrain.tileManager.getRenderableTiles()
//   - map.terrain.getTerrainMesh(tileID), getTerrainData(tileID),
//     getMeshFrameDelta(zoom)               (these are @internal but stable)
//   - map.transform.getProjectionData(...)
//   - args.shaderData.vertexShaderPrelude   (provides projectTileFor3D)
//   - MercatorCoordinate.fromLngLat / .meterInMercatorCoordinateUnits()
// =============================================================================

const GBUF_SIZE = 1024;       // G-buffer resolution
const ELE_MIN   = -500;       // packing range (meters)
const ELE_MAX   = 9000;

function orthoMatrix(l, r, b, t, n, f) {
    const m = new Float32Array(16);
    m[0]  = 2 / (r - l);
    m[5]  = 2 / (t - b);
    m[10] = -2 / (f - n);
    m[12] = -(r + l) / (r - l);
    m[13] = -(t + b) / (t - b);
    m[14] = -(f + n) / (f - n);
    m[15] = 1;
    return m;
}

const map = new maplibregl.Map({
    container: 'map',
    zoom: 12.5,
    center: [11.39085, 47.27574],   // Innsbruck, Alps
    pitch: 70,
    bearing: -20,
    maxPitch: 85,
    style: {
        version: 8,
        sources: {
            osm: {
                type: 'raster',
                tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                tileSize: 256,
                attribution: '&copy; OpenStreetMap Contributors',
                maxzoom: 19
            },
            terrainSource: {
                type: 'raster-dem',
                url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
                tileSize: 256
            }
        },
        layers: [{id: 'osm', type: 'raster', source: 'osm'}],
        terrain: {source: 'terrainSource', exaggeration: 1.0}
    }
});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));

// -----------------------------------------------------------------------------
// Observer state + UI
// -----------------------------------------------------------------------------
const observer = {lngLat: null, height: 2, marker: null};
const settings = {aoiRadiusM: 5000, steps: 96, biasM: 2.0};

map.on('click', (e) => {
    observer.lngLat = e.lngLat;
    if (observer.marker) observer.marker.remove();
    observer.marker = new maplibregl.Marker({color: '#d92626'})
        .setLngLat(e.lngLat).addTo(map);
    map.triggerRepaint();
});
document.getElementById('height').oninput = (e) => {
    observer.height = +e.target.value;
    document.getElementById('heightLabel').textContent = e.target.value;
    map.triggerRepaint();
};
document.getElementById('aoi').oninput = (e) => {
    settings.aoiRadiusM = +e.target.value * 1000;
    document.getElementById('aoiLabel').textContent = e.target.value;
    map.triggerRepaint();
};
document.getElementById('steps').oninput = (e) => {
    settings.steps = +e.target.value;
    document.getElementById('stepsLabel').textContent = e.target.value;
    map.triggerRepaint();
};
document.getElementById('bias').oninput = (e) => {
    settings.biasM = +e.target.value / 10;
    document.getElementById('biasLabel').textContent = settings.biasM.toFixed(1);
    map.triggerRepaint();
};
document.getElementById('reset').onclick = () => {
    observer.lngLat = null;
    if (observer.marker) { observer.marker.remove(); observer.marker = null; }
    map.triggerRepaint();
};

// -----------------------------------------------------------------------------
// Custom Viewshed Layer (G-buffer + main render)
// -----------------------------------------------------------------------------
const viewshedLayer = {
    id: 'viewshed',
    type: 'custom',
    renderingMode: '3d',

    onAdd(mapInstance, gl) {
        this.map = mapInstance;
        this._setupGBuffer(gl);
        this._setupPass1Program(gl);
        // Pass 2 program is built lazily in render() because it needs
        // shaderData.vertexShaderPrelude from the first render call.
        this.pass2Cache = new Map();
    },

    onRemove(mapInstance, gl) {
        if (this.gbufFBO) gl.deleteFramebuffer(this.gbufFBO);
        if (this.gbufTex) gl.deleteTexture(this.gbufTex);
        if (this.gbufDepth) gl.deleteRenderbuffer(this.gbufDepth);
        if (this.pass1Program) gl.deleteProgram(this.pass1Program);
        if (this.pass2Cache) {
            for (const v of this.pass2Cache.values()) gl.deleteProgram(v.program);
        }
    },

    _setupGBuffer(gl) {
        // RGBA8 packed-float G-buffer storing elevation in mercator-ortho space.
        this.gbufTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, this.gbufTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GBUF_SIZE, GBUF_SIZE, 0,
                      gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        this.gbufDepth = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, this.gbufDepth);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16,
                               GBUF_SIZE, GBUF_SIZE);

        this.gbufFBO = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.gbufFBO);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                                gl.TEXTURE_2D, this.gbufTex, 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT,
                                   gl.RENDERBUFFER, this.gbufDepth);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        gl.bindTexture(gl.TEXTURE_2D, null);
    },

    _setupPass1Program(gl) {
        // Vertex: top-down ortho around observer in mercator space.
        // Reads DEM elevation per vertex, emits mercator (xy) + elevation
        // packed into clip space; fragment writes elevation as packed RGBA.
        const vs = `#version 300 es
            precision highp float;
            in vec3 a_pos3d;
            uniform mat4 u_ortho_merc;
            uniform vec4 u_projection_tile_mercator_coords;
            uniform sampler2D u_terrain;
            uniform mat4 u_terrain_matrix;
            uniform float u_terrain_dim;
            uniform vec4 u_terrain_unpack;
            uniform float u_terrain_exaggeration;
            uniform float u_ele_delta;
            out float v_ele;

            // Replicated from src/shaders/glsl/_prelude.vertex.glsl:136-166
            float ele(vec2 pos) {
                vec4 rgb = (texture(u_terrain, pos) * 255.0) * u_terrain_unpack;
                return rgb.r + rgb.g + rgb.b - u_terrain_unpack.a;
            }
            float get_elevation(vec2 pos) {
                vec2 coord = (u_terrain_matrix * vec4(pos, 0.0, 1.0)).xy * u_terrain_dim + 1.0;
                vec2 f = fract(coord);
                vec2 c = (floor(coord) + 0.5) / (u_terrain_dim + 2.0);
                float d = 1.0 / (u_terrain_dim + 2.0);
                float tl = ele(c);
                float tr = ele(c + vec2(d, 0.0));
                float bl = ele(c + vec2(0.0, d));
                float br = ele(c + vec2(d, d));
                return mix(mix(tl, tr, f.x), mix(bl, br, f.x), f.y) * u_terrain_exaggeration;
            }

            void main() {
                float e = get_elevation(a_pos3d.xy);
                float ele_delta = a_pos3d.z == 1.0 ? u_ele_delta : 0.0;
                vec2 mercFrac = a_pos3d.xy / 8192.0;
                vec2 merc = u_projection_tile_mercator_coords.xy
                          + u_projection_tile_mercator_coords.zw * mercFrac;
                gl_Position = u_ortho_merc * vec4(merc, e - ele_delta, 1.0);
                v_ele = e;
            }`;

        const fs = `#version 300 es
            precision highp float;
            in float v_ele;
            uniform float u_ele_min;
            uniform float u_ele_max;
            out vec4 fragColor;

            // Pack a normalized [0, 1] float into RGBA8 (24-bit precision).
            vec4 packFloat(float v) {
                v = clamp(v, 0.0, 1.0);
                vec4 enc = vec4(1.0, 255.0, 65025.0, 16581375.0) * v;
                enc = fract(enc);
                enc -= enc.yzww * vec4(1.0/255.0, 1.0/255.0, 1.0/255.0, 0.0);
                return enc;
            }

            void main() {
                float n = (v_ele - u_ele_min) / (u_ele_max - u_ele_min);
                fragColor = packFloat(n);
            }`;

        const compile = (type, src, label) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error(`Pass1 ${label} shader:\n` + gl.getShaderInfoLog(s));
            }
            return s;
        };
        this.pass1Program = gl.createProgram();
        gl.attachShader(this.pass1Program, compile(gl.VERTEX_SHADER, vs, 'vertex'));
        gl.attachShader(this.pass1Program, compile(gl.FRAGMENT_SHADER, fs, 'fragment'));
        gl.linkProgram(this.pass1Program);
        if (!gl.getProgramParameter(this.pass1Program, gl.LINK_STATUS)) {
            console.error('Pass1 link: ' + gl.getProgramInfoLog(this.pass1Program));
        }

        this.p1A = {aPos3d: gl.getAttribLocation(this.pass1Program, 'a_pos3d')};
        this.p1U = {};
        for (const n of [
            'u_ortho_merc', 'u_projection_tile_mercator_coords',
            'u_terrain', 'u_terrain_matrix', 'u_terrain_dim',
            'u_terrain_unpack', 'u_terrain_exaggeration', 'u_ele_delta',
            'u_ele_min', 'u_ele_max'
        ]) this.p1U[n] = gl.getUniformLocation(this.pass1Program, n);
    },
    _getPass2Program(gl, shaderData) {
        // Per-projection-variant cache (mercator vs globe shaders differ).
        const key = shaderData.variantName;
        if (this.pass2Cache.has(key)) return this.pass2Cache.get(key);

        // Vertex: uses MapLibre's official prelude (provides projectTileFor3D
        // for current projection), then calls it with elevation.
        // Outputs mercator (xy) + raw elevation for fragment ray-march.
        const vs = `#version 300 es
            precision highp float;
            ${shaderData.vertexShaderPrelude}
            ${shaderData.define}

            in vec3 a_pos3d;

            uniform vec4 u_projection_tile_mercator_coords;
            uniform sampler2D u_terrain;
            uniform mat4 u_terrain_matrix;
            uniform float u_terrain_dim;
            uniform vec4 u_terrain_unpack;
            uniform float u_terrain_exaggeration;
            uniform float u_ele_delta;

            out vec2 v_frag_merc;
            out float v_frag_ele;

            // Replicated from src/shaders/glsl/_prelude.vertex.glsl:136-166
            float ele(vec2 pos) {
                vec4 rgb = (texture(u_terrain, pos) * 255.0) * u_terrain_unpack;
                return rgb.r + rgb.g + rgb.b - u_terrain_unpack.a;
            }
            float get_elevation(vec2 pos) {
                vec2 coord = (u_terrain_matrix * vec4(pos, 0.0, 1.0)).xy * u_terrain_dim + 1.0;
                vec2 f = fract(coord);
                vec2 c = (floor(coord) + 0.5) / (u_terrain_dim + 2.0);
                float d = 1.0 / (u_terrain_dim + 2.0);
                float tl = ele(c);
                float tr = ele(c + vec2(d, 0.0));
                float bl = ele(c + vec2(0.0, d));
                float br = ele(c + vec2(d, d));
                return mix(mix(tl, tr, f.x), mix(bl, br, f.x), f.y) * u_terrain_exaggeration;
            }

            void main() {
                float e = get_elevation(a_pos3d.xy);
                float ele_delta = a_pos3d.z == 1.0 ? u_ele_delta : 0.0;
                // Use the official prelude function — handles mercator + globe.
                gl_Position = projectTileFor3D(a_pos3d.xy, e - ele_delta);

                vec2 mercFrac = a_pos3d.xy / 8192.0;
                v_frag_merc = u_projection_tile_mercator_coords.xy
                            + u_projection_tile_mercator_coords.zw * mercFrac;
                v_frag_ele = e;
            }`;

        const fs = `#version 300 es
            precision highp float;
            in vec2 v_frag_merc;
            in float v_frag_ele;

            uniform sampler2D u_gbuf;            // packed elevation G-buffer
            uniform vec2 u_gbuf_origin;          // mercator (left, top)
            uniform vec2 u_gbuf_size;            // mercator (width, height)
            uniform float u_ele_min;
            uniform float u_ele_max;

            uniform vec3 u_observer_merc;        // (merc.x, merc.y, elevation in m)
            uniform float u_observer_valid;
            uniform float u_aoi_radius;          // in mercator units
            uniform float u_bias;                // in meters
            uniform int u_steps;

            // Depth Replacement (skirt z-fighting)
            uniform highp sampler2D u_depth;
            uniform vec2 u_viewport;

            out vec4 fragColor;

            float unpackPacked(vec4 rgba) {
                return dot(rgba, vec4(1.0, 1.0/255.0, 1.0/65025.0, 1.0/16581375.0));
            }
            float unpackDepth(vec4 rgba) {
                return dot(rgba, vec4(1.0/16581375.0, 1.0/65025.0, 1.0/255.0, 1.0));
            }
            float gbufElevation(vec2 merc) {
                vec2 uv = (merc - u_gbuf_origin) / u_gbuf_size;
                if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return -9999.0;
                float n = unpackPacked(texture(u_gbuf, uv));
                return mix(u_ele_min, u_ele_max, n);
            }

            void main() {
                vec2 fragUV = gl_FragCoord.xy / u_viewport;

                // Depth Replacement: bit-match base terrain depth.
                gl_FragDepth = unpackDepth(texture(u_depth, fragUV));

                if (u_observer_valid < 0.5) discard;

                vec2 obsM = u_observer_merc.xy;
                float obsE = u_observer_merc.z;
                vec2 fragM = v_frag_merc;
                float fragE = v_frag_ele;

                // AOI clipping
                float distToObs = length(fragM - obsM);
                if (distToObs > u_aoi_radius) discard;

                // World-space ray-march in mercator XY, sampling the G-buffer.
                bool blocked = false;
                int steps = u_steps;
                for (int i = 1; i < 256; i++) {
                    if (i >= steps - 1) break;
                    float t = float(i) / float(steps);
                    vec2 sM = mix(obsM, fragM, t);
                    float rayE = mix(obsE, fragE, t);
                    float terE = gbufElevation(sM);
                    if (terE > rayE + u_bias) { blocked = true; break; }
                }

                fragColor = blocked
                    ? vec4(0.85, 0.15, 0.15, 0.50)
                    : vec4(0.20, 0.85, 0.30, 0.45);
            }`;

        const compile = (type, src, label) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error(`Pass2[${key}] ${label} shader:\n` + gl.getShaderInfoLog(s));
            }
            return s;
        };
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vs, 'vertex'));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs, 'fragment'));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(`Pass2[${key}] link: ` + gl.getProgramInfoLog(program));
        }

        const aPos3d = gl.getAttribLocation(program, 'a_pos3d');
        const u = {};
        for (const n of [
            'u_projection_matrix', 'u_projection_fallback_matrix',
            'u_projection_clipping_plane', 'u_projection_transition',
            'u_projection_tile_mercator_coords',
            'u_terrain', 'u_terrain_matrix', 'u_terrain_dim',
            'u_terrain_unpack', 'u_terrain_exaggeration', 'u_ele_delta',
            'u_gbuf', 'u_gbuf_origin', 'u_gbuf_size',
            'u_ele_min', 'u_ele_max',
            'u_observer_merc', 'u_observer_valid', 'u_aoi_radius',
            'u_bias', 'u_steps',
            'u_depth', 'u_viewport'
        ]) u[n] = gl.getUniformLocation(program, n);

        const entry = {program, aPos3d, u};
        this.pass2Cache.set(key, entry);
        return entry;
    },
    // Compute observer's mercator position + AOI bounds. Returns null if
    // observer is unset or terrain is off.
    _computeObserverAoi() {
        const terrain = this.map.terrain;
        if (!observer.lngLat || !terrain) return null;

        const groundEle = this.map.queryTerrainElevation(observer.lngLat) || 0;
        const totalEle = groundEle + observer.height;
        const merc = maplibregl.MercatorCoordinate.fromLngLat(observer.lngLat, 0);
        const mpu = merc.meterInMercatorCoordinateUnits();   // m → mercator units
        const half = settings.aoiRadiusM * mpu;
        return {
            mercX: merc.x,
            mercY: merc.y,
            totalEle,
            half,
            mpu,
            ortho: orthoMatrix(
                merc.x - half, merc.x + half,
                merc.y + half, merc.y - half,    // Y flipped (mercator down)
                ELE_MIN, ELE_MAX                  // ortho z range
            )
        };
    },

    prerender(gl, args) {
        // Pass 1 — generate G-buffer (top-down ortho elevation around observer).
        const aoi = this._computeObserverAoi();
        if (!aoi) return;
        const terrain = this.map.terrain;

        // Bind G-buffer FBO and prepare state.
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.gbufFBO);
        gl.viewport(0, 0, GBUF_SIZE, GBUF_SIZE);
        gl.clearColor(0, 0, 0, 0);
        gl.clearDepth(1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.depthMask(true);
        gl.disable(gl.BLEND);
        gl.disable(gl.CULL_FACE);

        gl.useProgram(this.pass1Program);
        gl.uniformMatrix4fv(this.p1U.u_ortho_merc, false, aoi.ortho);
        gl.uniform1f(this.p1U.u_ele_min, ELE_MIN);
        gl.uniform1f(this.p1U.u_ele_max, ELE_MAX);

        const eleDelta = terrain.getMeshFrameDelta(this.map.transform.zoom);
        gl.uniform1f(this.p1U.u_ele_delta, eleDelta);

        for (const tile of terrain.tileManager.getRenderableTiles()) {
            const tileID = tile.tileID;
            const td = terrain.getTerrainData(tileID);

            // Tile mercator base + size (wrap-aware).
            const c = tileID.canonical;
            const scale = 1 / (1 << c.z);
            gl.uniform4f(
                this.p1U.u_projection_tile_mercator_coords,
                c.x * scale + tileID.wrap, c.y * scale,
                scale, scale
            );

            // Skip tiles outside AOI (perf).
            const tileLeft   = c.x * scale + tileID.wrap;
            const tileTop    = c.y * scale;
            if (tileLeft + scale < aoi.mercX - aoi.half ||
                tileLeft > aoi.mercX + aoi.half ||
                tileTop + scale < aoi.mercY - aoi.half ||
                tileTop > aoi.mercY + aoi.half) continue;

            gl.activeTexture(gl.TEXTURE2);
            gl.bindTexture(gl.TEXTURE_2D, td.texture.texture);
            gl.uniform1i(this.p1U.u_terrain, 2);
            gl.uniformMatrix4fv(this.p1U.u_terrain_matrix, false, td.u_terrain_matrix);
            gl.uniform1f(this.p1U.u_terrain_dim, td.u_terrain_dim);
            gl.uniform4fv(this.p1U.u_terrain_unpack, td.u_terrain_unpack);
            gl.uniform1f(this.p1U.u_terrain_exaggeration, td.u_terrain_exaggeration);

            const mesh = terrain.getTerrainMesh(tileID);
            gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vertexBuffer.buffer);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer.buffer);
            gl.enableVertexAttribArray(this.p1A.aPos3d);
            gl.vertexAttribPointer(this.p1A.aPos3d, 3, gl.SHORT, false, 0, 0);
            gl.drawElements(
                gl.TRIANGLES,
                mesh.segments.get()[0].primitiveLength * 3,
                gl.UNSIGNED_SHORT, 0
            );
        }

        // Restore framebuffer; painter will reset its viewport for Pass 2.
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        this.map.painter.context.bindFramebuffer.dirty = true;

        // Stash for render() use
        this._aoi = aoi;
    },
    render(gl, args) {
        // Pass 2 — main on-screen render with viewshed analysis.
        const aoi = this._aoi;
        const terrain = this.map.terrain;
        if (!aoi || !terrain) return;

        const {program, aPos3d, u} = this._getPass2Program(gl, args.shaderData);
        gl.useProgram(program);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        // G-buffer texture (slot 4)
        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D, this.gbufTex);
        gl.uniform1i(u.u_gbuf, 4);
        gl.uniform2f(u.u_gbuf_origin, aoi.mercX - aoi.half, aoi.mercY - aoi.half);
        gl.uniform2f(u.u_gbuf_size, 2 * aoi.half, 2 * aoi.half);
        gl.uniform1f(u.u_ele_min, ELE_MIN);
        gl.uniform1f(u.u_ele_max, ELE_MAX);

        gl.uniform3f(u.u_observer_merc, aoi.mercX, aoi.mercY, aoi.totalEle);
        gl.uniform1f(u.u_observer_valid, 1.0);
        gl.uniform1f(u.u_aoi_radius, aoi.half);
        gl.uniform1f(u.u_bias, settings.biasM);
        gl.uniform1i(u.u_steps, settings.steps);

        const dpr = window.devicePixelRatio || 1;
        gl.uniform2f(u.u_viewport,
                     gl.canvas.width / dpr, gl.canvas.height / dpr);

        const eleDelta = terrain.getMeshFrameDelta(this.map.transform.zoom);
        gl.uniform1f(u.u_ele_delta, eleDelta);

        for (const tile of terrain.tileManager.getRenderableTiles()) {
            const tileID = tile.tileID;
            const td = terrain.getTerrainData(tileID);

            // Projection uniforms — official prelude requires the full set.
            const proj = this.map.transform.getProjectionData({
                overscaledTileID: tileID,
                applyTerrainMatrix: false,
                applyGlobeMatrix: true
            });
            gl.uniformMatrix4fv(u.u_projection_matrix, false, proj.mainMatrix);
            gl.uniformMatrix4fv(u.u_projection_fallback_matrix, false, proj.fallbackMatrix);
            gl.uniform4f(u.u_projection_clipping_plane, ...proj.clippingPlane);
            gl.uniform1f(u.u_projection_transition, proj.projectionTransition);
            gl.uniform4f(u.u_projection_tile_mercator_coords, ...proj.tileMercatorCoords);

            // Terrain DEM (slot 2)
            gl.activeTexture(gl.TEXTURE2);
            gl.bindTexture(gl.TEXTURE_2D, td.texture.texture);
            gl.uniform1i(u.u_terrain, 2);
            gl.uniformMatrix4fv(u.u_terrain_matrix, false, td.u_terrain_matrix);
            gl.uniform1f(u.u_terrain_dim, td.u_terrain_dim);
            gl.uniform4fv(u.u_terrain_unpack, td.u_terrain_unpack);
            gl.uniform1f(u.u_terrain_exaggeration, td.u_terrain_exaggeration);

            // Terrain depth FBO for Depth Replacement (slot 3)
            gl.activeTexture(gl.TEXTURE3);
            gl.bindTexture(gl.TEXTURE_2D, td.depthTexture);
            gl.uniform1i(u.u_depth, 3);

            const mesh = terrain.getTerrainMesh(tileID);
            gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vertexBuffer.buffer);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuffer.buffer);
            gl.enableVertexAttribArray(aPos3d);
            gl.vertexAttribPointer(aPos3d, 3, gl.SHORT, false, 0, 0);
            gl.drawElements(
                gl.TRIANGLES,
                mesh.segments.get()[0].primitiveLength * 3,
                gl.UNSIGNED_SHORT, 0
            );
        }
    }
};

map.on('style.load', () => {
    map.addLayer(viewshedLayer);
});
</script>
</body>
</html>
